name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell regression tests
        shell: bash
        run: |
          for test in tests/*.tests.sh; do
            bash "$test"
          done
      - name: Notification process tests
        run: python3 tests/ralph-notify.tests.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows launcher tests
        shell: powershell
        run: ./tests/setup-wsl-path.tests.ps1
